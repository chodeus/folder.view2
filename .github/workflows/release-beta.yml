name: Release Beta

on:
  workflow_dispatch:

# pkg_build.sh stamps the version from `date`, so the runner must use the same
# timezone as a local build or a morning trigger emits yesterday's version.
env:
  TZ: Australia/Perth

jobs:
  beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # beta is protected and requires "Lint + build", which never runs on a direct
      # push (ci.yml fires on main + pull_request only), so GITHUB_TOKEN is rejected
      # with GH006. A PAT pushes as the repo owner, who bypasses via enforce_admins=false.
      - name: Check release token
        env:
          TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Missing secret BETA_RELEASE_TOKEN — the default GITHUB_TOKEN cannot push to the protected beta branch."
            echo "::error::Create a fine-grained PAT (repo chodeus/folder.view3, Contents: Read and write) and add it as BETA_RELEASE_TOKEN."
            exit 1
          fi

      - name: Checkout beta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ secrets.BETA_RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "chodeus"
          git config user.email "dhoges90@outlook.com"

      - name: Show build date
        run: echo "Building with TZ=$TZ — date is $(date +%Y.%m.%d) (UTC is $(TZ=UTC date +%Y.%m.%d))"

      # pkg_build.sh --beta auto-increments the .N hotfix number from the existing
      # archives and emits folder.view3-YYYY.MM.DD.N-x86_64-1.txz with beta URLs.
      - name: Build beta package
        run: |
          chmod +x pkg_build.sh
          bash pkg_build.sh --beta

      - name: Extract beta version
        id: beta
        run: |
          VERSION=$(grep -oP '<!ENTITY version "\K[^"]+' folder.view3.plg)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          FILENAME="folder.view3-${VERSION}-x86_64-1.txz"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "Beta version: $VERSION"

      - name: Verify build
        run: |
          VERSION="${{ steps.beta.outputs.version }}"
          FILENAME="archive/folder.view3-${VERSION}-x86_64-1.txz"

          if [ ! -f "$FILENAME" ]; then
            echo "ERROR: Expected $FILENAME not found"
            ls -la archive/
            exit 1
          fi

          echo "Package: $FILENAME (plg version $VERSION)"

          # pkg_build writes no changelog — warn if this version has no CHANGES block
          if ! grep -q "^###${VERSION}\$" folder.view3.plg; then
            echo "::warning::No '###${VERSION}' entry in the .plg CHANGES section — this beta will ship without release notes."
          fi

      - name: Commit and push to beta
        run: |
          git add archive/ folder.view3.plg
          git commit -m "Build beta ${{ steps.beta.outputs.version }}"
          git push origin beta
